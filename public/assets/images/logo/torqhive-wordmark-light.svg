    <polygon points="40,9 67,24.5 67,55.5 40,71 13,55.5 13,24.5" fill="none" stroke="url(#wmRed)" stroke-width="1" opacity="0.8" />
    
    <path d="M18 22 L39 22 L39 33 L21 33 Z" fill="url(#wmSteel)" />
    <path d="M41 22 L62 22 L59 33 L41 33 Z" fill="url(#wmRed)" filter="url(#wmGlow)" />
    <polygon points="40,25 43,27 43,30 40,32 37,30 37,27" fill="#0E0F12" />
    <circle cx="40" cy="28.5" r="1.2" fill="#FFFFFF" />

